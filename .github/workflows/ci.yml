name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Sicherheitsprüfung Laufzeit-Abhängigkeiten (jede Schwachstelle)
        run: npm audit --omit=dev
      - name: Sicherheitsprüfung aller Abhängigkeiten (ab hoch)
        run: npm audit --audit-level=high
