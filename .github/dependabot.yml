version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      entwicklung:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node.js bleibt auf Version 22 (LTS); Hauptversionen nur bewusst anheben.
      - dependency-name: node
        update-types: ['version-update:semver-major']
