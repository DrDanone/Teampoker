<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wilkenpoker</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Wilkenpoker</h1>
      <span id="room-title" class="room-title"></span>
      <span id="logo-slot" class="logo-slot"></span>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="join-view" hidden>
        <h2>Raum beitreten</h2>
        <form id="join-form" novalidate>
          <label for="code">Raum-Code</label>
          <input
            id="code"
            name="code"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="12"
            placeholder="z. B. AB3D5F7H"
            required
          />
          <label for="name">Dein Name</label>
          <input id="name" name="name" autocomplete="nickname" maxlength="30" required />
          <button type="submit">Beitreten</button>
        </form>
      </section>

      <section id="room-view" hidden>
        <div class="round-bar">
          <h2 id="round-title">Runde 1</h2>
          <span id="progress" class="progress"></span>
        </div>

        <section aria-labelledby="cards-title">
          <h3 id="cards-title" class="visually-hidden">Deine Karte</h3>
          <p id="cards-hint" class="hint">
            Wähle deine Karte. Bis zum Aufdecken kannst du sie ändern.
          </p>
          <div id="cards" class="cards" role="group" aria-labelledby="cards-title"></div>
        </section>

        <div class="round-actions">
          <button id="reveal" type="button">Aufdecken</button>
          <button id="reset" type="button" class="button-secondary">Alle zurücksetzen</button>
        </div>

        <section id="result" class="result" hidden aria-live="polite">
          <p id="consensus" class="consensus" hidden>Einigkeit!</p>
          <dl class="stats">
            <div>
              <dt>Durchschnitt</dt>
              <dd id="stat-average">–</dd>
            </div>
            <div>
              <dt>Median</dt>
              <dd id="stat-median">–</dd>
            </div>
            <div>
              <dt>Spanne</dt>
              <dd id="stat-spread">–</dd>
            </div>
          </dl>
          <p id="stat-note" class="hint"></p>
        </section>

        <h3>Teilnehmer</h3>
        <ul id="participants" class="participants"></ul>
        <button id="leave" type="button" class="button-secondary">Raum verlassen</button>
      </section>
    </main>
  </body>
</html>
