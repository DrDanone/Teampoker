# Teampoker für ZimaOS (oder jeden anderen Docker-Host).
# Anleitung: docs/ZIMAOS.md
name: teampoker

services:
  teampoker:
    image: ghcr.io/drdanone/teampoker:latest
    container_name: teampoker
    restart: unless-stopped

    environment:
      # Pflicht: Passwort für die Verwaltung unter /admin/, mindestens 12 Zeichen.
      # Ohne Passwort startet Teampoker absichtlich nicht.
      ADMIN_PASSWORD: ''
      PORT: '3000'
      # Öffentliche Adresse über den Cloudflare Tunnel – damit kopierte
      # Einladungslinks von außen funktionieren (sonst Heimnetz-Adresse).
      PUBLIC_URL: ''
      # Verwaltung nur aus diesen Netzen und nie über den Cloudflare Tunnel.
      # Standard: private Netze (Heimnetz, Docker). '*' = überall, auch über den Tunnel.
      # ADMIN_NETWORKS: '192.168.178.0/24'
      # Netze, aus denen der Tunnel kommt; dessen CF-Connecting-IP gilt als
      # echte Client-Adresse. Standard: private Netze.
      # TRUSTED_PROXIES: '172.16.0.0/12'

    ports:
      - '8090:3000'

    volumes:
      # Räume und Logo. Der Ordner muss dem Benutzer mit UID 1000 gehören.
      - /DATA/AppData/teampoker:/data

    # Härtung: unprivilegierter Benutzer, schreibgeschütztes Dateisystem
    # (außer /data und /tmp), keine Linux-Capabilities.
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Angaben für die App-Übersicht von ZimaOS/CasaOS (optional).
x-casaos:
  main: teampoker
  architectures:
    - amd64
    - arm64
  author: DrDanone
  category: Utilities
  title:
    en_us: Teampoker
    de_de: Teampoker
  description:
    en_us: Planning Poker for refinements.
    de_de: Planning Poker für die Refinements.
  port_map: '8090'
  index: /
